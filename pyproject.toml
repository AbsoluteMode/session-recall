[project]
name = "session-recall"
version = "0.4.0"
description = "Semantic recall over your local Claude Code and Codex session history — one shared index, searchable by meaning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Butorin" }]
keywords = [
    "claude-code", "codex", "mcp", "semantic-search", "embeddings",
    "agent-memory", "session-history", "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sqlite-vec==0.1.9",
    "voyageai>=0.3.0",
    "mcp>=1.2.0,<2",
    "pynacl>=1.5",
    "pysqlite3>=0.6.0; sys_platform == 'darwin'",
    # the zero-setup default path (bundled ONNX embeddings) must work on a
    # bare install, so like voyageai this is a direct dependency, not an extra
    "fastembed>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]
openai = ["openai>=1.0"]
# Optional: lets the share worker write a real answer from retrieved fragments
# instead of returning them raw. Off unless SESSION_RECALL_COMPOSE=claude.
compose = ["anthropic>=0.116"]

[project.scripts]
session-recall = "session_recall.cli:main"
session-recall-mcp = "session_recall.server:main"

[tool.pytest.ini_options]
markers = ["live: hits real Voyage API (needs VOYAGE_API_KEY); excluded by default"]
addopts = "-m 'not live'"

[project.urls]
Homepage = "https://github.com/AbsoluteMode/session-recall"
Repository = "https://github.com/AbsoluteMode/session-recall"
Issues = "https://github.com/AbsoluteMode/session-recall/issues"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
